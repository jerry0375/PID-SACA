[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pid-saca"
version = "0.1.0"
description = "PID-controlled constrained RL for hub-based joint pricing, dispatching, and routing."
requires-python = ">=3.10"
dependencies = [
  "numpy",
  "scipy",
  "matplotlib",
  "pandas",
  "torch",
]

[tool.setuptools.packages.find]
where = ["src"]
